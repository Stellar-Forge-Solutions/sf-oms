# Cloudflare Pages config for sf-orders.
# With this file present, the file is the source of truth for plain variables (the dashboard shows them read-only).
# SECRETS never go here: add them in the dashboard (Settings > Variables and Secrets > Secret)
# or with: npx wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY --project-name sf-orders

name = "sf-orders"
pages_build_output_dir = "dist"
# Tested locally with 2024-01-01 and no compatibility flags.
compatibility_date = "2024-09-01"

[vars]
NODE_VERSION = "20"
